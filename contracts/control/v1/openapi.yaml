openapi: 3.1.0
info:
  title: Starry Control API
  version: 1.0.0
  description: >-
    Versioned, least-privilege management API for a single Starry HBBS instance.
    Remote deployments require both mTLS and a short-lived scoped service JWT.
servers:
  - url: https://starry-control.example.test/control/v1
security:
  - mutualTLS: []
    serviceJWT: []
tags:
  - name: Control
  - name: Peer
  - name: Relay
  - name: Configuration
  - name: Operations
paths:
  /capabilities:
    get:
      tags: [Control]
      operationId: getCapabilities
      x-required-scope: starry.control.read
      responses:
        "200":
          description: Negotiated protocol capabilities and hard limits.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Capabilities"}
        default: {$ref: "#/components/responses/Problem"}
  /status:
    get:
      tags: [Control]
      operationId: getStatus
      x-required-scope: starry.control.read
      responses:
        "200":
          description: Structured HBBS, configuration, and authentication state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        default: {$ref: "#/components/responses/Problem"}
  /peers:verify:
    post:
      tags: [Peer]
      operationId: verifyPeerActivation
      x-required-scope: starry.peer.verify
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PeerVerificationRequest"}
      responses:
        "200":
          description: Exact, side-effect-free verification of an active HBBS profile lease.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PeerVerification"}
        default: {$ref: "#/components/responses/Problem"}
  /relays:
    get:
      tags: [Relay]
      operationId: listRelays
      x-required-scope: starry.relay.read
      responses:
        "200":
          description: Immutable Relay inventory snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [config_generation, health_snapshot_id, relays, quality, fast_relay, profile_activation, warning]
                properties:
                  config_generation: {type: integer, format: int64, minimum: 0}
                  health_snapshot_id: {type: string}
                  relays:
                    type: array
                    items: {$ref: "#/components/schemas/Relay"}
                  quality: {$ref: "#/components/schemas/RelayQualityRuntime"}
                  fast_relay: {$ref: "#/components/schemas/FastRelayRuntime"}
                  profile_activation: {$ref: "#/components/schemas/ProfileActivationRuntime"}
                  warning: {type: string}
        default: {$ref: "#/components/responses/Problem"}
  /relay-enrollments:
    get:
      tags: [Relay]
      operationId: listRelayEnrollments
      x-required-scope: starry.relay.read
      responses:
        "200":
          description: Bounded enrollment summaries; no SP1 secret, telemetry secret, private key, or CSR is returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, items]
                properties:
                  version: {const: 1}
                  items: {type: array, maxItems: 2048, items: {$ref: "#/components/schemas/RelayEnrollmentSummary"}}
        default: {$ref: "#/components/responses/Problem"}
  /relay-enrollments/{id}:
    get:
      tags: [Relay]
      operationId: getRelayEnrollment
      x-required-scope: starry.relay.read
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: One non-sensitive enrollment summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelayEnrollmentSummary"}
        default: {$ref: "#/components/responses/Problem"}
  /relay-enrollments:prepare:
    post:
      tags: [Relay]
      operationId: prepareRelayEnrollment
      x-required-scope: starry.relay.enroll
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RelayEnrollmentPrepareRequest"}
      responses:
        "200":
          description: Prepared short-lived enrollment bound to an approved Relay configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelayEnrollmentPrepareResponse"}
        default: {$ref: "#/components/responses/Problem"}
  /relay-enrollments:complete:
    post:
      tags: [Relay]
      operationId: completeRelayEnrollment
      x-required-scope: starry.relay.enroll
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RelayEnrollmentCompleteRequest"}
      responses:
        "200":
          description: One-time key-bound Relay bundle. The caller must durably install and then redact the telemetry secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelayEnrollmentCompleteResponse"}
        default: {$ref: "#/components/responses/Problem"}
  /relay-enrollments:activate:
    post:
      tags: [Relay]
      operationId: activateRelayEnrollment
      x-required-scope: starry.relay.enroll
      description: >-
        Attests a health-gated Relay activation after the referenced config_apply
        operation has a successful HBBS activation ACK. The Agent independently
        reads the current Relay inventory and requires the exact generation,
        health snapshot, endpoint, capacity, telemetry and profile capabilities.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RelayEnrollmentActivateRequest"}
      responses:
        "200":
          description: Active enrollment summary. Repeating the exact evidence is idempotent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelayEnrollmentSummary"}
        default: {$ref: "#/components/responses/Problem"}
  /relay-enrollments:revoke:
    post:
      tags: [Relay]
      operationId: revokeRelayEnrollment
      x-required-scope: starry.relay.enroll
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RelayEnrollmentRevokeRequest"}
      responses:
        "200":
          description: Revoked enrollment summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelayEnrollmentSummary"}
        default: {$ref: "#/components/responses/Problem"}
  /allocations:simulate:
    post:
      tags: [Relay]
      operationId: simulateAllocation
      x-required-scope: starry.relay.simulate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AllocationSimulationRequest"}
      responses:
        "200":
          description: Non-binding, side-effect-free allocation decision trace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllocationTrace"}
        default: {$ref: "#/components/responses/Problem"}
  /config/schema:
    get:
      tags: [Configuration]
      operationId: getConfigSchema
      x-required-scope: starry.config.read
      responses:
        "200":
          description: Config JSON Schema and UI Schema with an independent ETag.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchemaBundle"}
        default: {$ref: "#/components/responses/Problem"}
  /config:
    get:
      tags: [Configuration]
      operationId: getConfig
      x-required-scope: starry.config.read
      responses:
        "200":
          description: Exact managed UTF-8 YAML document and active runtime state. Referenced secret file contents are never returned.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigState"}
        default: {$ref: "#/components/responses/Problem"}
  /config:validate:
    post:
      tags: [Configuration]
      operationId: validateConfig
      x-required-scope: starry.config.validate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfigCandidate"}
      responses:
        "200":
          description: Validation result produced by the same parser used by HBBS runtime activation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationResult"}
        default: {$ref: "#/components/responses/Problem"}
  /config:plan:
    post:
      tags: [Configuration]
      operationId: planConfig
      x-required-scope: starry.config.plan
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfigCandidate"}
      responses:
        "200":
          description: Expiring diff and impact plan bound to instance, ETag, generation, and candidate digest.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigPlan"}
        default: {$ref: "#/components/responses/Problem"}
  /config:apply:
    post:
      tags: [Configuration]
      operationId: applyConfig
      x-required-scope: starry.config.apply
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_id, candidate_digest]
              properties:
                plan_id: {$ref: "#/components/schemas/Uuid"}
                candidate_digest: {$ref: "#/components/schemas/Sha256"}
                comment: {type: string, maxLength: 500}
      responses:
        "202":
          description: Durable asynchronous configuration transaction accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Operation"}
        default: {$ref: "#/components/responses/Problem"}
  /config/history:
    get:
      tags: [Configuration]
      operationId: getConfigHistory
      x-required-scope: starry.config.read
      responses:
        "200":
          description: Redacted revision manifests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: {$ref: "#/components/schemas/Revision"}
        default: {$ref: "#/components/responses/Problem"}
  /config:rollback:
    post:
      tags: [Configuration]
      operationId: rollbackConfig
      x-required-scope: starry.config.rollback
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision_id]
              properties:
                revision_id: {$ref: "#/components/schemas/Uuid"}
                comment: {type: string, maxLength: 500}
      responses:
        "202":
          description: Rollback-as-new-transaction accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Operation"}
        default: {$ref: "#/components/responses/Problem"}
  /operations/{id}:
    get:
      tags: [Operations]
      operationId: getOperation
      x-required-scope: starry.control.read
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: Durable operation state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Operation"}
        default: {$ref: "#/components/responses/Problem"}
  /runtime:reload:
    post:
      tags: [Control]
      operationId: reloadRuntime
      x-required-scope: starry.runtime.reload
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_source_digest]
              properties:
                expected_source_digest: {$ref: "#/components/schemas/Sha256"}
      responses:
        "200":
          description: Synchronous runtime activation acknowledgement.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivationAck"}
        default: {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    serviceJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA service JWT, maximum lifetime five minutes, audience urn:starry-control:<instance_id>.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {$ref: "#/components/schemas/StrongETag"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: {$ref: "#/components/schemas/Uuid"}
  headers:
    ETag:
      schema: {$ref: "#/components/schemas/StrongETag"}
      description: Strong SHA-256 ETag over exact disk bytes.
  responses:
    Problem:
      description: Stable RFC 9457 problem response.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Uuid:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
    Sha256:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    StrongETag:
      type: string
      minLength: 73
      maxLength: 73
      pattern: '^"sha256:[0-9a-f]{64}"$'
    Base64Uuid:
      type: string
      minLength: 24
      maxLength: 24
      pattern: "^[A-Za-z0-9+/]{22}==$"
    Base64RouteLease:
      type: string
      minLength: 44
      maxLength: 44
      pattern: "^[A-Za-z0-9+/]{43}=$"
    PeerVerificationRequest:
      type: object
      additionalProperties: false
      required: [id, uuid, activation_epoch, activation_id, route_leases]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        uuid: {$ref: "#/components/schemas/Base64Uuid"}
        activation_epoch: {type: integer, format: int64, minimum: 1}
        activation_id: {$ref: "#/components/schemas/Base64Uuid"}
        route_leases:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {$ref: "#/components/schemas/Base64RouteLease"}
    PeerVerification:
      type: object
      additionalProperties: false
      required: [instance_id, registered]
      properties:
        instance_id: {$ref: "#/components/schemas/Uuid"}
        registered: {type: boolean}
    Capabilities:
      type: object
      additionalProperties: false
      required: [protocol, instance, capabilities, config, limits]
      properties:
        protocol:
          type: object
          additionalProperties: false
          required: [name, version, major]
          properties:
            name: {const: starry-control}
            version: {type: string}
            major: {const: 1}
        instance:
          type: object
          additionalProperties: false
          required: [id, role, starry_version, upstream_version]
          properties:
            id: {$ref: "#/components/schemas/Uuid"}
            role: {const: hbbs}
            starry_version: {type: string}
            upstream_version: {type: string}
        capabilities:
          type: object
          required: [config_schema]
          properties:
            config_schema:
              type: integer
              const: 5
              description: Maximum Starry configuration schema understood by this contract candidate.
          additionalProperties: {type: integer, minimum: 1}
        config:
          type: object
          additionalProperties: false
          required: [supported_schema_versions, active_schema_version, schema_digest]
          properties:
            supported_schema_versions:
              type: array
              items: {type: integer, enum: [1, 2, 3, 4, 5]}
            active_schema_version: {type: integer, enum: [1, 2, 3, 4, 5]}
            schema_digest: {$ref: "#/components/schemas/Sha256"}
        limits:
          type: object
          additionalProperties: false
          required: [max_config_bytes, max_plan_lifetime_seconds, operation_retention_seconds]
          properties:
            max_config_bytes: {type: integer, maximum: 1048576}
            max_plan_lifetime_seconds: {type: integer, maximum: 600}
            operation_retention_seconds: {type: integer, minimum: 86400}
    Status:
      type: object
      additionalProperties: false
      required: [ready, config, auth]
      properties:
        ready: {type: boolean}
        config: {$ref: "#/components/schemas/RuntimeConfigState"}
        auth:
          type: object
          additionalProperties: false
          required: [configured_mode, effective_mode, verifier_state, key_count, key_age_seconds, metrics]
          properties:
            configured_mode: {type: string, enum: [off, audit, enforce]}
            effective_mode: {type: string, enum: [off, audit, enforce]}
            verifier_state: {type: string, enum: [disabled, ready, degraded, unavailable]}
            key_count: {type: integer, minimum: 0}
            key_age_seconds: {type: [integer, "null"], minimum: 0}
            metrics:
              type: object
              additionalProperties: false
              required: [attempts, allowed, denied, audit_would_deny, cache_hits, introspection_requests, introspection_failures]
              properties:
                attempts: {type: integer, minimum: 0}
                allowed: {type: integer, minimum: 0}
                denied: {type: integer, minimum: 0}
                audit_would_deny: {type: integer, minimum: 0}
                cache_hits: {type: integer, minimum: 0}
                introspection_requests: {type: integer, minimum: 0}
                introspection_failures: {type: integer, minimum: 0}
    Relay:
      type: object
      additionalProperties: false
      required: [id, version, capabilities, quality_candidate, configured_order, native, websocket, fast_media_udp, eligible_for, referenced_by_rules]
      properties:
        id: {type: string}
        version: {type: [string, "null"], description: Exact Starry HBBR version observed in the most recent successful WSS handshake; null for legacy or unprobed Relays.}
        capabilities:
          type: object
          additionalProperties: false
          required: [relay_probe_protocol, relay_load_protocol, fast_media_relay_udp]
          properties:
            relay_probe_protocol: {type: [integer, "null"], minimum: 1, description: Explicit HBBR active-probe protocol version; null means legacy/unsupported.}
            relay_load_protocol: {type: [integer, "null"], minimum: 1, description: Explicit HBBR load-telemetry protocol version; null means legacy/unsupported.}
            fast_media_relay_udp: {type: [integer, "null"], minimum: 1, description: Explicit authenticated HBBR AKR1 UDP capability; null means unavailable.}
        quality_candidate: {type: boolean, description: True only when explicitly non-legacy, capability-compatible, healthy, and telemetry-fresh.}
        configured_order: {type: integer, minimum: 0}
        native:
          type: object
          additionalProperties: false
          required: [state, observed_at]
          properties:
            state: {type: string, enum: [online, offline, unknown]}
            observed_at: {$ref: "#/components/schemas/DateTime"}
        websocket:
          type: object
          additionalProperties: false
          required: [configured, url, state, last_probe_at, observed_at, observed_at_unix_ms, age_seconds, stale, latency_ms, telemetry_schema, process_instance_id, telemetry_sequence, uptime_seconds, telemetry_restarts, last_restart_at, load_basis_points, active_sessions, pending_pairs, capacity_sessions, bandwidth_bps, bandwidth_ema_alpha_basis_points, capacity_bandwidth_bps, draining, admission_open, admission_rejections, probe_malformed, probe_unsupported, probe_rate_limited, probe_successful, telemetry_auth_failures, error_code, error_message]
          properties:
            configured: {type: boolean}
            url: {type: [string, "null"]}
            state: {type: string, enum: [unknown, healthy, unhealthy, disabled]}
            last_probe_at: {oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]}
            observed_at: {oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]}
            observed_at_unix_ms: {type: [integer, "null"], format: int64, minimum: 0}
            age_seconds: {type: [integer, "null"], format: int64, minimum: 0}
            stale: {type: boolean}
            latency_ms: {type: [integer, "null"], minimum: 0}
            telemetry_schema:
              oneOf:
                - {type: integer, enum: [1, 2]}
                - {type: "null"}
            process_instance_id: {type: [string, "null"], maxLength: 64}
            telemetry_sequence: {type: [integer, "null"], format: int64, minimum: 1}
            uptime_seconds: {type: [integer, "null"], format: int64, minimum: 0}
            telemetry_restarts: {type: integer, format: int64, minimum: 0}
            last_restart_at: {oneOf: [{$ref: "#/components/schemas/DateTime"}, {type: "null"}]}
            load_basis_points: {type: [integer, "null"], minimum: 0, maximum: 10000}
            active_sessions: {type: [integer, "null"], minimum: 0}
            pending_pairs: {type: [integer, "null"], minimum: 0}
            capacity_sessions: {type: [integer, "null"], minimum: 1}
            bandwidth_bps: {type: [integer, "null"], format: int64, minimum: 0}
            bandwidth_ema_alpha_basis_points: {type: [integer, "null"], minimum: 1, maximum: 10000}
            capacity_bandwidth_bps: {type: [integer, "null"], format: int64, minimum: 1}
            draining: {type: [boolean, "null"]}
            admission_open: {type: [boolean, "null"]}
            admission_rejections: {type: [integer, "null"], format: int64, minimum: 0}
            probe_malformed: {type: [integer, "null"], format: int64, minimum: 0}
            probe_unsupported: {type: [integer, "null"], format: int64, minimum: 0}
            probe_rate_limited: {type: [integer, "null"], format: int64, minimum: 0}
            probe_successful: {type: [integer, "null"], format: int64, minimum: 0}
            telemetry_auth_failures: {type: [integer, "null"], format: int64, minimum: 0}
            error_code: {type: [string, "null"]}
            error_message: {type: [string, "null"], maxLength: 256}
        fast_media_udp:
          $ref: "#/components/schemas/FastMediaUdpRuntime"
        eligible_for:
          type: array
          items: {type: string, enum: [native, wss, mixed]}
        referenced_by_rules:
          type: array
          items: {type: string}
    RelayQualityRuntime:
      type: object
      additionalProperties: false
      required: [protocol_version, strategy, enabled, active_allocations, cached_network_pairs, pending_decisions, offers_created, offers_skipped, offer_skip_reasons, peer_reports_accepted, controller_reports_accepted, reports_accepted, reports_duplicate, reports_stage_mismatch, reports_late, reports_invalid, reports_binding_mismatch, decisions_created, fallback_decisions, fallback_reasons, cache_hits, hysteresis_decisions, primary_probes, primary_accepted, expansions_triggered, p2p_cancellations, estimated_probe_attempts_saved, expanded_decisions, stage_timeouts, relay_selections, relay_selection_overflow]
      properties:
        protocol_version: {const: 1}
        strategy: {type: string, enum: [adaptive, eager]}
        enabled: {type: boolean}
        active_allocations: {type: integer, minimum: 0}
        cached_network_pairs: {type: integer, minimum: 0}
        pending_decisions: {type: integer, minimum: 0}
        offers_created: {type: integer, format: int64, minimum: 0}
        offers_skipped: {type: integer, format: int64, minimum: 0}
        offer_skip_reasons:
          type: object
          additionalProperties: false
          required: [disabled, unsupported_client, invalid_fallback, inconsistent_snapshot, insufficient_candidates, primary_not_probeable]
          properties:
            disabled: {type: integer, format: int64, minimum: 0}
            unsupported_client: {type: integer, format: int64, minimum: 0}
            invalid_fallback: {type: integer, format: int64, minimum: 0}
            inconsistent_snapshot: {type: integer, format: int64, minimum: 0}
            insufficient_candidates: {type: integer, format: int64, minimum: 0}
            primary_not_probeable: {type: integer, format: int64, minimum: 0}
        peer_reports_accepted: {type: integer, format: int64, minimum: 0}
        controller_reports_accepted: {type: integer, format: int64, minimum: 0}
        reports_accepted: {type: integer, format: int64, minimum: 0}
        reports_duplicate: {type: integer, format: int64, minimum: 0}
        reports_stage_mismatch: {type: integer, format: int64, minimum: 0}
        reports_late: {type: integer, format: int64, minimum: 0}
        reports_invalid: {type: integer, format: int64, minimum: 0}
        reports_binding_mismatch: {type: integer, format: int64, minimum: 0}
        decisions_created: {type: integer, format: int64, minimum: 0}
        fallback_decisions: {type: integer, format: int64, minimum: 0}
        fallback_reasons:
          type: object
          additionalProperties: false
          required: [legacy_fallback, probe_failure, manual_override, invalid_report, report_late]
          properties:
            legacy_fallback: {type: integer, format: int64, minimum: 0}
            probe_failure: {type: integer, format: int64, minimum: 0}
            manual_override: {type: integer, format: int64, minimum: 0}
            invalid_report: {type: integer, format: int64, minimum: 0}
            report_late: {type: integer, format: int64, minimum: 0}
        cache_hits: {type: integer, format: int64, minimum: 0}
        hysteresis_decisions: {type: integer, format: int64, minimum: 0}
        primary_probes: {type: integer, format: int64, minimum: 0}
        primary_accepted: {type: integer, format: int64, minimum: 0}

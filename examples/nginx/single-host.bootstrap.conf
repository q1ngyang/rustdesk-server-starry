# Temporary HTTP-only site used to obtain the first certificate with Certbot's
# Nginx plugin. Replace rustdesk.example.com, enable this site, obtain the
# certificate, then replace it with single-host.example.conf.
server {
    listen 80;
    listen [::]:80;
    server_name rustdesk.example.com;

    location / {
        return 404;
    }
}

# Deploy one certificate-valid copy on every Relay hostname and replace all
# relay-1.example.com values. Native 21117/TCP does not pass through Nginx.
server {
    listen 80;
    listen [::]:80;
    server_name relay-1.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay-1.example.com;

    ssl_certificate /etc/letsencrypt/live/relay-1.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-1.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_socket_keepalive on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}

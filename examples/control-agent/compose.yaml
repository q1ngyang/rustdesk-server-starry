# Control Agent sidecar example. All host persistence lives below
# STARRY_PERSIST_ROOT, while separate bind mounts preserve the authentication,
# secret, shared-token, and writable-state permission boundaries. Prepare the
# exact tree and files described in
# docs/examples/control-agent/README.md (from the repository/archive root).
# https://github.com/q1ngyang/rustdesk-server-starry/blob/main/docs/examples/control-agent/README.md
# Read that guide before starting this stack.
# The Agent shares the HBBS network namespace solely so 127.0.0.1:21115 remains
# a local-only channel.
name: rustdesk-server-starry-control

services:
  hbbs:
    image: ${STARRY_IMAGE}:${STARRY_VERSION}
    command:
      - hbbs
      - --starry-config=/starry/config.yaml
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
      STARRY_LOCAL_CONTROL_TOKEN_FILE: /run/secrets/starry-control-shared/local-control.token
    volumes:
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/hbbs
        target: /root
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/config
        target: /starry
        read_only: true
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/auth/secrets
        target: /run/secrets/starry-auth
        read_only: true
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/auth/cache
        target: /var/lib/starry-auth
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/control/shared
        target: /run/secrets/starry-control-shared
        read_only: true
    network_mode: host
    restart: ${STARRY_RESTART_POLICY:-unless-stopped}

  control-agent:
    image: ${STARRY_IMAGE}:${STARRY_VERSION}
    user: ${STARRY_CONTROL_UID:-65532}:${STARRY_CONTROL_GID:-65532}
    command:
      - starry-control-agent
      - /etc/starry-control/agent.yaml
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ./control-agent.yaml
        target: /etc/starry-control/agent.yaml
        read_only: true
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/control/secrets
        target: /run/secrets/starry-control
        read_only: true
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/control/shared
        target: /run/secrets/starry-control-shared
        read_only: true
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/config
        target: /starry
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/control/state
        target: /control-state
    network_mode: service:hbbs
    depends_on:
      - hbbs
    restart: ${STARRY_RESTART_POLICY:-unless-stopped}
    read_only: true
    init: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  hbbr:
    # The Starry image includes the compatible probe/load HBBR built from the
    # same pinned RustDesk Server revision. Using the same image tag for both
    # services prevents independent HBBS/HBBR version drift.
    image: ${STARRY_IMAGE}:${STARRY_VERSION}
    command: [hbbr, -k, _]
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
      STARRY_RELAY_MAX_SESSIONS: ${RELAY_MAX_SESSIONS:-10000}
      STARRY_RELAY_PROBE_PER_IP_PER_MINUTE: ${RELAY_PROBE_PER_IP_PER_MINUTE:-120}
      STARRY_RELAY_PROBE_GLOBAL_PER_MINUTE: ${RELAY_PROBE_GLOBAL_PER_MINUTE:-10000}
      STARRY_RELAY_TELEMETRY_SECRET_FILE: ${RELAY_TELEMETRY_SECRET_FILE:-}
      STARRY_RELAY_DRAINING_FILE: ${RELAY_DRAINING_FILE:-/root/starry/hbbr.draining}
    volumes:
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/hbbs
        target: /root
    network_mode: host
    depends_on:
      - hbbs
    restart: ${STARRY_RESTART_POLICY:-unless-stopped}

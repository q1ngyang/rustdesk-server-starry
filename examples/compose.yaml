# Recommended single-host deployment for rustdesk-server-starry.
#
# Starry extends HBBS and adds compatible quality probes/load telemetry to HBBR.
# Both services are built from the same pinned upstream source and use one exact
# Starry image tag so an unrelated official-image update cannot split versions.
#
# Repository checkout:
#   cp examples/.env.example .env
#   cp examples/compose.yaml compose.yaml
#   mkdir -p data
#   docker compose --env-file .env -f compose.yaml config --quiet
#   docker compose --env-file .env -f compose.yaml up -d
#
# GitHub Release assets:
#   cp compose.env.example .env
#   mkdir -p data
#   docker compose --env-file .env -f compose.yaml config --quiet
#   docker compose --env-file .env -f compose.yaml up -d
#
# Linux host networking is intentional: HBBS needs the real peer address for
# NAT and Geo decisions. Do not use this file unchanged on Docker Desktop.

name: ${STARRY_COMPOSE_PROJECT_NAME:-rustdesk-server-starry}

services:
  hbbs:
    image: ${STARRY_IMAGE:-ghcr.io/q1ngyang/rustdesk-server-starry}:${STARRY_VERSION:-1.1.16-patch-v1.3.1}
    container_name: ${STARRY_HBBS_CONTAINER_NAME:-rustdesk-starry-hbbs}
    command:
      - hbbs
      - --starry-config=/root/starry/config.yaml
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/hbbs
        target: /root
    network_mode: host
    restart: ${STARRY_RESTART_POLICY:-unless-stopped}
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /root/id_ed25519 &&
          test -s /root/id_ed25519.pub &&
          nc -w 2 127.0.0.1 21116 </dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  hbbr:
    image: ${STARRY_IMAGE:-ghcr.io/q1ngyang/rustdesk-server-starry}:${STARRY_VERSION:-1.1.16-patch-v1.3.1}
    container_name: ${STARRY_HBBR_CONTAINER_NAME:-rustdesk-hbbr}
    entrypoint: [starry-relay-entrypoint]
    command:
      - -k
      - _
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
      RELAY_DATA_DIR: /var/lib/rustdesk-server-starry/relay
      STARRY_REQUIRE_PERSISTENT_STATE: "1"
      STARRY_REQUIRE_RELAY_ENROLLMENT: ${RELAY_REQUIRE_ENROLLMENT:-0}
      STARRY_RELAY_MAX_SESSIONS: ${RELAY_MAX_SESSIONS:-10000}
      STARRY_RELAY_PROBE_PER_IP_PER_MINUTE: ${RELAY_PROBE_PER_IP_PER_MINUTE:-120}
      STARRY_RELAY_PROBE_GLOBAL_PER_MINUTE: ${RELAY_PROBE_GLOBAL_PER_MINUTE:-10000}
      STARRY_RELAY_TELEMETRY_SECRET_FILE: ${RELAY_TELEMETRY_SECRET_FILE:-}
      STARRY_RELAY_DRAINING_FILE: ${RELAY_DRAINING_FILE:-/var/lib/rustdesk-server-starry/relay/starry/hbbr.draining}
    volumes:
      - type: bind
        source: ${STARRY_PERSIST_ROOT:-./persist}/relay
        target: /var/lib/rustdesk-server-starry/relay
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
    network_mode: host
    depends_on:
      hbbs:
        condition: service_healthy
    restart: ${STARRY_RESTART_POLICY:-unless-stopped}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

# Complete Starry data-plane reference centre:
#   Starry HBBS + compatible probe/load HBBR in the same Starry image tag.
#
# Account and management APIs are a separate trust boundary. Deploy the
# recommended Kessoku release from its own immutable Docker input and follow
# the Kessoku Wiki. This Starry file intentionally does not execute an API
# image and does not carry a bootstrap administrator secret.

name: ${CENTER_COMPOSE_PROJECT_NAME:-rustdesk-center}

services:
  hbbs:
    image: ${STARRY_IMAGE:-ghcr.io/q1ngyang/rustdesk-server-starry}:${STARRY_VERSION:-1.1.16-patch-v1.3.0}
    container_name: ${CENTER_HBBS_CONTAINER_NAME:-rustdesk-starry-hbbs}
    command:
      - hbbs
      - --starry-config=/root/starry/config.yaml
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ${CENTER_SERVER_DATA_DIR:-./data/server}
        target: /root
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /root/id_ed25519 &&
          test -s /root/id_ed25519.pub &&
          nc -w 2 127.0.0.1 21116 </dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  hbbr:
    image: ${STARRY_IMAGE:-ghcr.io/q1ngyang/rustdesk-server-starry}:${STARRY_VERSION:-1.1.16-patch-v1.3.0}
    container_name: ${CENTER_HBBR_CONTAINER_NAME:-rustdesk-hbbr}
    command:
      - hbbr
      - -k
      - _
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
      STARRY_RELAY_MAX_SESSIONS: ${RELAY_MAX_SESSIONS:-10000}
      STARRY_RELAY_PROBE_PER_IP_PER_MINUTE: ${RELAY_PROBE_PER_IP_PER_MINUTE:-120}
      STARRY_RELAY_PROBE_GLOBAL_PER_MINUTE: ${RELAY_PROBE_GLOBAL_PER_MINUTE:-10000}
      STARRY_RELAY_TELEMETRY_SECRET_FILE: ${RELAY_TELEMETRY_SECRET_FILE:-}
      STARRY_RELAY_DRAINING_FILE: ${RELAY_DRAINING_FILE:-/root/starry/hbbr.draining}
    volumes:
      - type: bind
        source: ${CENTER_SERVER_DATA_DIR:-./data/server}
        target: /root
    network_mode: host
    depends_on:
      hbbs:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

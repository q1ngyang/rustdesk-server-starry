# Advanced expression examples. Replace hosts and MMDB URLs before use.
version: 1

relay_servers:
  - relay-asia-1.example.com:21117
  - relay-asia-2.example.com:21117
  - relay-us-1.example.com:21117

secure_tcp:
  mode: auto

mmdb:
  update_interval_hours: 168
  update_on_start: true
  force_update: false
  download_timeout_seconds: 600
  minimum_bytes: 65536
  country:
    path: mmdb/GeoLite2-Country.mmdb
    url: https://downloads.example.com/GeoLite2-Country.mmdb
  city:
    path: mmdb/GeoLite2-City.mmdb
    url: https://downloads.example.com/GeoLite2-City.mmdb
  asn:
    path: mmdb/GeoLite2-ASN.mmdb
    url: https://downloads.example.com/GeoLite2-ASN.mmdb

geo:
  enabled: true
  rules:
    - name: China telecom cities to Asia
      symmetric: true
      match:
        client_a: "(city:Shanghai+isp:'China Telecom')/(city:Beijing+asn:AS4134)"
        client_b: CN/JP/KR/TW
      relays:
        - relay-asia-1.example.com:21117
        - relay-asia-2.example.com:21117

    - name: Direction-sensitive US destination
      symmetric: false
      match:
        client_a: "country:CN+asn:AS4134"
        client_b: country:US
      relays:
        - relay-us-1.example.com:21117

    - name: Final catch-all
      symmetric: true
      match:
        client_a: "*"
        client_b: "*"
      relays:
        - relay-asia-2.example.com:21117
        - relay-us-1.example.com:21117

# rustdesk-server-starry configuration example.
# Copy the required sections to config.yaml. An empty or invalid config.yaml
# keeps the exact upstream rustdesk-server behavior on first start. A rejected
# reload retains the last-known-good active generation.
version: 4

# The complete HBBS relay pool. Keep one relay server on each line.
relay_servers:
  - jp-relay-1.example.com:21117
  - jp-relay-2.example.com:21117
  - us-relay-1.example.com:21117

secure_tcp:
  # auto sends the RustDesk Secure TCP offer on native TCP 21116, accepts a
  # compatible key exchange, and still accepts a valid plaintext first frame.
  # off preserves the upstream plaintext-only transport.
  mode: auto
  handshake_timeout_ms: 18000
  idle_timeout_ms: 30000
  max_frame_bytes: 65536

# WSS signalling is opt-in. Clients may keep WebSocket disabled for normal
# native P2P performance and enable it only in restricted enterprise networks.
# This setting makes /ws/id support persistent registration; it does not force
# any client to use WebSocket.
websocket_signal:
  enabled: true
  registration_timeout_ms: 10000
  keepalive_interval_ms: 12000
  idle_timeout_ms: 45000
  max_frame_bytes: 65536
  outbound_queue_capacity: 64
  max_sessions: 10000
  max_sessions_per_effective_ip: 512
  registration_rate_per_minute: 300

  # Forwarded client IP headers are trusted only from these proxy networks.
  trusted_proxies:
    - 127.0.0.1/32
    - ::1/128

  # Native RustDesk clients send no Origin and remain accepted. If an Origin
  # header is present, it must exactly match one item in this list.
  allowed_origins: []

  # Every relay_servers entry must have exactly one certificate-verified WSS
  # endpoint. Authenticated telemetry uses /ws/telemetry plus a secret-file
  # reference; the secret value never appears in YAML, URLs, logs, or APIs.
  relay_health:
    interval_seconds: 60
    timeout_ms: 5000
    success_threshold: 1
    failure_threshold: 2
    endpoints:
      - relay: jp-relay-1.example.com:21117
        url: wss://jp-relay-1.example.com/ws/telemetry
        telemetry_secret_file: /run/secrets/starry-relay-telemetry
      - relay: jp-relay-2.example.com:21117
        url: wss://jp-relay-2.example.com/ws/telemetry
        telemetry_secret_file: /run/secrets/starry-relay-telemetry
      - relay: us-relay-1.example.com:21117
        url: wss://us-relay-1.example.com/ws/telemetry
        telemetry_secret_file: /run/secrets/starry-relay-telemetry

# Connection authentication requires schema v3 or newer and defaults to off. Move to
# audit before enforce, and do not enable either mode until Kessoku (or another
# compatible issuer) supplies Ed25519 JWKS and client connection JWTs.
connection_auth:
  mode: off

  # Example audit/enforce values:
  # issuer: https://kessoku.example
  # audience: rustdesk-connect
  # token_use: access
  # required_scope: connect:initiate
  # max_token_bytes: 8192
  # clock_skew_seconds: 30
  # jwks:
  #   file: /var/lib/starry-auth/jwks.json
  #   url: https://kessoku.example/api/internal/v1/auth/jwks
  #   refresh_interval_seconds: 300
  #   max_stale_seconds: 3600
  #   ca_file: /run/secrets/starry-auth/internal-ca.pem
  #   cert_file: /run/secrets/starry-auth/hbbs-client.pem
  #   key_file: /run/secrets/starry-auth/hbbs-client-key.pem
  #   server_name: kessoku.example
  # introspection:
  #   required: true
  #   url: https://kessoku.example/api/internal/v1/auth/introspect
  #   timeout_ms: 1000
  #   positive_cache_seconds: 10
  #   negative_cache_seconds: 1
  #   max_cache_entries: 100000
  #   ca_file: /run/secrets/starry-auth/internal-ca.pem
  #   cert_file: /run/secrets/starry-auth/hbbs-client.pem
  #   key_file: /run/secrets/starry-auth/hbbs-client-key.pem
  #   server_name: kessoku.example

# Akari-only candidate Relay probing. Official RustDesk clients do not send
# the protocol opt-in and continue to receive one ordinary relay_server.
relay_quality:
  enabled: false
  strategy: adaptive
  legacy_fallback_relays: []
  max_candidates: 3
  primary_probe_samples: 3
  primary_accept_score: 8000
  primary_max_loss_basis_points: 500
  p2p_probe_grace_ms: 300
  probe_samples: 5
  probe_interval_ms: 50
  probe_timeout_ms: 1000
  report_timeout_ms: 15000
  max_telemetry_age_seconds: 180
  allocation_ttl_seconds: 30
  cache_ttl_seconds: 300
  max_allocations: 10000
  hysteresis_basis_points: 500
  missing_report_penalty_basis_points: 1000
  rtt_bad_ms: 300
  jitter_bad_ms: 100
  weights:
    rtt: 4000
    jitter: 2000
    loss: 2500
    load: 1500

# FastCompat authorization for Akari over the existing reliable HBBR stream.
# Keep this disabled until connection authentication and Relay quality are both
# enabled and verified. FastMediaV1 Relay UDP is deliberately not advertised.
fast_mode:
  relay:
    fast_compat_enabled: false
    authorization_ttl_seconds: 90
    max_bitrate_kbps: 50000

mmdb:
  update_interval_hours: 168
  update_on_start: true
  force_update: false
  download_timeout_seconds: 600
  minimum_bytes: 65536
  country:
    path: mmdb/GeoLite2-Country.mmdb
    url: https://example.com/GeoLite2-Country.mmdb
  city:
    path: mmdb/GeoLite2-City.mmdb
    url: https://example.com/GeoLite2-City.mmdb
  asn:
    path: mmdb/GeoLite2-ASN.mmdb
    url: https://example.com/GeoLite2-ASN.mmdb

geo:
  enabled: true
  rules:
    # Operators: / means OR, + means AND, and parentheses may be nested.
    # A bare two-letter token is a country code. Supported explicit fields:
    # continent, country, subdivision, city, geoname, asn, isp.
    - name: East Asia telecom or Tokyo
      symmetric: true
      match:
        client_a: "(city:上海+isp:China Telecom)/city:东京"
        client_b: "CN/JP/KR/TW"
      # Strict priority: the first online relay wins; the next is used only
      # after the previous relay is unavailable.
      relays:
        - jp-relay-1.example.com:21117
        - jp-relay-2.example.com:21117

    - name: Nested expression example
      symmetric: true
      match:
        client_a: "((city:上海+isp:China Telecom)/(city:首尔+isp:KT))+country:CN"
        client_b: "*"
      relays:
        - us-relay-1.example.com:21117
